syntax = "proto3";

// Source of truth for the Kiln API (ADR-0006). Change this first, regenerate,
// then implement. Never hand-edit generated code.
package kiln.v1;

option go_package = "github.com/ORG/kiln/gen/kiln/v1;kilnv1";

import "google/protobuf/timestamp.proto";

// ---------------------------------------------------------------------------
// Core resources
// ---------------------------------------------------------------------------

message Service {
  string id = 1;
  string tenant_id = 2;      // every resource is tenant-scoped (CLAUDE.md rule 10)
  string environment_id = 3;
  string name = 4;
  Source source = 5;
  Runtime runtime = 6;
  repeated SecretRef secrets = 7;   // handles only, never values (rule 3)
  string revision_id = 8;           // the revision this state came from
}

message Source {
  oneof kind {
    GitSource git = 1;
    ImageSource image = 2;
    StaticSource static = 3;
  }
}

message GitSource {
  string repo_url = 1;
  string ref = 2;
  string subpath = 3;
  BuildStrategy strategy = 4;
}

message ImageSource { string digest = 1; }   // digest, not tag
message StaticSource { string build_command = 1; string output_dir = 2; }

enum BuildStrategy {
  BUILD_STRATEGY_UNSPECIFIED = 0;
  BUILD_STRATEGY_AUTO = 1;        // detect
  BUILD_STRATEGY_DOCKERFILE = 2;
  BUILD_STRATEGY_BUILDPACKS = 3;
  BUILD_STRATEGY_NIXPACKS = 4;
}

message Runtime {
  int32 replicas = 1;
  string cpu = 2;      // "500m"
  string memory = 3;   // "512Mi"
  repeated Port ports = 4;
  HealthCheck health = 5;
}

message Port { int32 container_port = 1; string protocol = 2; bool public = 3; }

message HealthCheck {
  string path = 1;
  int32 interval_seconds = 2;
  int32 timeout_seconds = 3;
  int32 failure_threshold = 4;
}

message SecretRef { string key = 1; string handle = 2; }  // handle resolves at apply time

// A Release is immutable: an artifact digest plus a config revision.
// Promotion across environments reuses the same digest.
message Release {
  string id = 1;
  string service_id = 2;
  string artifact_digest = 3;
  string config_revision_id = 4;
  string provenance_ref = 5;    // SLSA attestation
  string sbom_ref = 6;
  google.protobuf.Timestamp created_at = 7;
}

// One attempt to reconcile a Release onto an Environment.
message Deployment {
  string id = 1;
  string release_id = 2;
  string environment_id = 3;
  DeploymentStrategy strategy = 4;
  DeploymentState state = 5;
  string workflow_id = 6;       // Temporal workflow (ADR-0002)
  string actor = 7;
  google.protobuf.Timestamp started_at = 8;
  google.protobuf.Timestamp finished_at = 9;
}

enum DeploymentStrategy {
  DEPLOYMENT_STRATEGY_UNSPECIFIED = 0;
  DEPLOYMENT_STRATEGY_ROLLING = 1;
  DEPLOYMENT_STRATEGY_BLUE_GREEN = 2;
  DEPLOYMENT_STRATEGY_CANARY = 3;
}

enum DeploymentState {
  DEPLOYMENT_STATE_UNSPECIFIED = 0;
  DEPLOYMENT_STATE_PENDING = 1;
  DEPLOYMENT_STATE_BUILDING = 2;
  DEPLOYMENT_STATE_AWAITING_APPROVAL = 3;
  DEPLOYMENT_STATE_APPLYING = 4;
  DEPLOYMENT_STATE_HEALTH_GATE = 5;
  DEPLOYMENT_STATE_SUCCEEDED = 6;
  DEPLOYMENT_STATE_FAILED = 7;
  DEPLOYMENT_STATE_ROLLED_BACK = 8;
}

// ---------------------------------------------------------------------------
// API — the UI gets nothing the CLI lacks (CLAUDE.md rule 8)
// ---------------------------------------------------------------------------

service DeploymentService {
  rpc CreateDeployment(CreateDeploymentRequest) returns (Deployment);
  rpc GetDeployment(GetDeploymentRequest) returns (Deployment);
  rpc ListDeployments(ListDeploymentsRequest) returns (ListDeploymentsResponse);
  rpc Rollback(RollbackRequest) returns (Deployment);
  rpc ApproveGate(ApproveGateRequest) returns (Deployment);
  rpc StreamLogs(StreamLogsRequest) returns (stream LogLine);
}

message CreateDeploymentRequest {
  string service_id = 1;
  string environment_id = 2;
  DeploymentStrategy strategy = 3;
  string idempotency_key = 4;
}
message GetDeploymentRequest { string id = 1; }
message ListDeploymentsRequest { string environment_id = 1; int32 page_size = 2; string page_token = 3; }
message ListDeploymentsResponse { repeated Deployment deployments = 1; string next_page_token = 2; }
message RollbackRequest { string environment_id = 1; string to_release_id = 2; string reason = 3; }
message ApproveGateRequest { string deployment_id = 1; string approver = 2; }
message StreamLogsRequest { string deployment_id = 1; bool follow = 2; }
message LogLine { google.protobuf.Timestamp ts = 1; string source = 2; string message = 3; }
