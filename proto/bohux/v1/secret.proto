syntax = "proto3";

package bohux.v1;

import "bohux/v1/common.proto";
import "google/api/field_behavior.proto";

option go_package = "github.com/bohumix/bohux/gen/bohux/v1;bohuxv1";

// A secret's metadata. The value lives only in OpenBao (ADR-0008, ADR-0014); this
// message and the `secret_refs` table hold the handle, never the value (rule 3).
message Secret {
  ResourceMeta meta = 1;
  string environment_id = 2 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_behavior) = IMMUTABLE
  ];
  // Unique within the environment.
  string key = 3 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_behavior) = IMMUTABLE
  ];
  // Stable for the key: setting a new value keeps the handle, so Apps referencing it
  // pick up the rotation.
  string handle = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
}

service SecretService {
  // Creates the secret, or sets a new value for an existing key.
  rpc SetSecret(SetSecretRequest) returns (SetSecretResponse);
  rpc ListSecretRefs(ListSecretRefsRequest) returns (ListSecretRefsResponse);
  rpc DeleteSecret(DeleteSecretRequest) returns (DeleteSecretResponse);
}

message SetSecretRequest {
  string environment_id = 1 [(google.api.field_behavior) = REQUIRED];
  string key = 2 [(google.api.field_behavior) = REQUIRED];
  // The one secret value in the public API (ADR-0014). Redacted by an interceptor
  // before any log, trace, or error; written only to OpenBao.
  string value = 3 [
    (google.api.field_behavior) = REQUIRED,
    debug_redact = true
  ];
  // Set when overwriting an existing key; empty when creating.
  string expected_revision_id = 4;
  string idempotency_key = 5 [(google.api.field_behavior) = REQUIRED];
}

message SetSecretResponse {
  Secret secret = 1;
}

message ListSecretRefsRequest {
  string environment_id = 1 [(google.api.field_behavior) = REQUIRED];
  int32 page_size = 2;
  string page_token = 3;
}

message ListSecretRefsResponse {
  repeated Secret secrets = 1;
  string next_page_token = 2;
}

message DeleteSecretRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
  string expected_revision_id = 2 [(google.api.field_behavior) = REQUIRED];
  string idempotency_key = 3 [(google.api.field_behavior) = REQUIRED];
}

message DeleteSecretResponse {
  string revision_id = 1;
}
